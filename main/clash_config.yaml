# =========================================================
#  Mihomo (Clash Meta) 旁路由/网关高性能原生配置文件
# =========================================================

# --- 基础基础设置 ---
mixed-port: 7890
allow-lan: true
mode: rule
log-level: info
ipv6: true

# --- 外部控制与面板（已接入 MetaCubeXD） ---
external-controller: '0.0.0.0:9090'
secret: '123456'
external-ui: 'ui'

# --- 旁路由/透明网关的核心 TUN 与 DNS 服务 ---
tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - "any:53"

dns:
  enable: true
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# =========================================================
#  1. 订阅节点提供商 (Proxy Provider)
# =========================================================
# 💡 请在下方 url 处替换为您真实的节点订阅链接
proxy-providers:
  subscription:
    type: http
    url: "https://your-real-subscription-link-here" 
    path: ./proxy_providers/subscription.yaml
    interval: 3600
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 300

# =========================================================
#  2. 策略组配置 (Proxy Groups)
# =========================================================
proxy-groups:
  # --- 1. 核心策略组 ---
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 全局自动
      - ⚖️ 🇭🇰 香港负载
      - ⚖️ 🇯🇵 日本负载
      - ⚖️ 🇸🇬 狮城负载
      - ⚖️ 🇰🇷 韩国负载
      - ⚖️ 🇹🇼 台湾负载
      - ⚖️ 🇺🇸 美国负载
      - 🖐️ 手动选择
      - 🏠 直连

  - name: ♻️ 全局自动
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 150
    use:
      - subscription

  # --- 2. 地区负载均衡组 (通过正则动态从订阅中提取节点) ---
  - name: ⚖️ 🇭🇰 香港负载
    type: load-balance
    strategy: round-robin
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    use:
      - subscription
    filter: '(?i)港|HK|HongKong|HGC|WTT|CMI|Hkg'

  - name: ⚖️ 🇯🇵 日本负载
    type: load-balance
    strategy: round-robin
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    use:
      - subscription
    filter: '(?i)日|JP|Japan|Tokyo|Osaka|Kyoto|Tyo'

  - name: ⚖️ 🇸🇬 狮城负载
    type: load-balance
    strategy: round-robin
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    use:
      - subscription
    filter: '(?i)新|SG|Singapore|Lion|Sgp'

  - name: ⚖️ 🇰🇷 韩国负载
    type: load-balance
    strategy: round-robin
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    use:
      - subscription
    filter: '(?i)韩|KR|Korea|KOR|Seoul|Sel'

  - name: ⚖️ 🇹🇼 台湾负载
    type: load-balance
    strategy: round-robin
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    use:
      - subscription
    filter: '(?i)台|TW|Taiwan|Taipei|Hinet|Tpe|NewTaipei'

  - name: ⚖️ 🇺🇸 美国负载
    type: load-balance
    strategy: round-robin
    url: https://cp.cloudflare.com/generate_204
    interval: 600
    use:
      - subscription
    filter: '(?i)美|US|States|America|Portland|San|Los|Seattle|Chicago|Sjc'

  # --- 3. 辅助分组 ---
  - name: 🖐️ 手动选择
    type: select
    use:
      - subscription

  # --- 4. 专项服务组 ---
  - name: 🤖 AI服务
    type: select
    proxies:
      - ⚖️ 🇺🇸 美国负载
      - ⚖️ 🇸🇬 狮城负载
      - ⚖️ 🇯🇵 日本负载
      - 🚀 节点选择

  - name: 🎵 TikTok
    type: select
    proxies:
      - ⚖️ 🇺🇸 美国负载
      - ⚖️ 🇯🇵 日本负载
      - ⚖️ 🇸🇬 狮城负载
      - ⚖️ 🇰🇷 韩国负载
      - ⚖️ 🇹🇼 台湾负载
      - ⚖️ 🇭🇰 香港负载
      - 🚀 节点选择

  - name: 📺 国际媒体
    type: select
    proxies:
      - ⚖️ 🇭🇰 香港负载
      - ⚖️ 🇯🇵 日本负载
      - ⚖️ 🇸🇬 狮城负载
      - ⚖️ 🇹🇼 台湾负载
      - ⚖️ 🇰🇷 韩国负载
      - ⚖️ 🇺🇸 美国负载
      - 🚀 节点选择

  - name: 📺 国内媒体
    type: select
    proxies:
      - 🏠 直连
      - ⚖️ 🇭🇰 香港负载
      - 🚀 节点选择

  - name: 📲 Telegram
    type: select
    proxies:
      - ⚖️ 🇸🇬 狮城负载
      - ⚖️ 🇭🇰 香港负载
      - ⚖️ 🇯🇵 日本负载
      - ⚖️ 🇰🇷 韩国负载
      - ⚖️ 🇹🇼 台湾负载
      - ⚖️ 🇺🇸 美国负载
      - 🚀 节点选择

  - name: 🔍 Google服务
    type: select
    proxies:
      - 🚀 节点选择
      - ⚖️ 🇭🇰 香港负载
      - ⚖️ 🇯🇵 日本负载
      - ⚖️ 🇸🇬 狮城负载
      - ⚖️ 🇰🇷 韩国负载
      - ⚖️ 🇹🇼 台湾负载
      - ⚖️ 🇺🇸 美国负载
      - 🏠 直连

  - name: 🍎 苹果服务
    type: select
    proxies:
      - 🏠 直连
      - 🚀 节点选择

  - name: 💻 微软服务
    type: select
    proxies:
      - 🏠 直连
      - 🚀 节点选择

  - name: 🎮 游戏服务
    type: select
    proxies:
      - 🏠 直连
      - 🚀 节点选择

  # --- 5. 基础状态组 ---
  - name: 🏠 直连
    type: select
    proxies:
      - DIRECT

  - name: 🚫 拦截
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: 🐟 漏网之鱼
    type: select
    proxies:
      - 🚀 节点选择
      - 🏠 直连

